[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "not-nova-act"
version = "0.1.0"
description = "Local-first rebuild of Nova Act browser-use: Playwright hands plus small local vision models."
requires-python = ">=3.12"
dependencies = ["playwright", "pydantic", "httpx", "redis"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
